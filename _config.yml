# Site settings
title: CivicOS Institute
description: >- 
  CivicOS Institute builds open, auditable civic infrastructure,
  AI literacy resources, and policy research for accountable public technology.
baseurl: ""
url: "https://civicos-institute.org"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Author information
author:
  name: Nicholas A. Cerbone
  email: NCerbone@civicos-institute.org

# Social links
social:
  github: CivicOSInstitute
  x: CivicOSInstitut
  discord: tECtT9zeTT
  facebook: CivicOSInstitute

# Navigation
navigation:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: Letter from Director
    url: /letter-from-director/
  - title: Blog
    url: /blog/
  - title: Governance
    url: /governance/
  - title: Publications
    url: /publications/
  - title: Research
    url: /research/
  - title: News
    url: /news.html
  - title: Ebook
    url: https://civicoslabs.com/ebook/
  - title: Contact
    url: /contact/

# Google Analytics (add ID after setup)
# google_analytics: UA-XXXXXXXX-X

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - AGENTS.md
  - BOOTSTRAP.md
  - COMMAND_CENTER_IO_MAP.md
  - MODEL_MATRIX.md
  - MODEL_ROUTING_MATRIX.md
  - WORKFLOW_V2_SPEC.md
  - assets/css/civicos.scss
  - civicos-full-site.html
  - browser-automation-stack/
  - campaigns/
  - config/
  - data/
  - docs/
  - generated/
  - governance.html
  - governance.md
  - google-voice-stack/
  - letter-archive/
  - main-dashboard/
  - notion-ops/
  - prompts/
  - runbooks/
  - scripts/
  - skills/
  - social_media/
  - templates/
  - the_open_source_student_distribution/
  - tmp/
  - token-dashboard/
  - website-news/
  - zine/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md

collections:
  letters:
    output: true
    permalink: /letters/:name/

defaults:
  - scope:
      path: ""
      type: "letters"
    values:
      layout: "letter"
