---
layout: default
---
<section class="sec">
  <a class="letter-back" href="{{ '/letters/' | relative_url }}">← All Letters</a>
  {{ content }}
</section>
<div style="padding:0 56px 56px;border-top:1px solid var(--border);display:flex;justify-content:space-between;">
  {% if page.prev_letter %}<a class="letter-nav-item" href="{{ page.prev_letter | relative_url }}">← Previous: {{ page.prev_title }}</a>{% else %}<span></span>{% endif %}
  {% if page.next_letter %}<a class="letter-nav-item" href="{{ page.next_letter | relative_url }}">Next: {{ page.next_title }} →</a>{% else %}<span class="letter-nav-item" style="color:var(--grey);cursor:default;">{{ page.next_title | default: 'Next Letter Coming Tuesday' }} →</span>{% endif %}
</div>
