<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CivicOS - Thank You</title>
  <style>
    body{font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#0b1220;color:#e6edf7;margin:0;display:grid;place-items:center;min-height:100vh}
    .card{max-width:700px;width:92%;background:#121a2b;border:1px solid #2a3752;border-radius:14px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
    h1{margin:0 0 10px;font-size:28px}
    p{margin:8px 0;line-height:1.5;color:#c6d4ea}
    .k{color:#8fb4ff}
    .btn{display:inline-block;margin-top:16px;background:#3b82f6;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:600}
    .small{font-size:13px;color:#9cb0cf;margin-top:14px}
  </style>
</head>
<body>
  <main class="card">
    <h1>Thank you for your submission.</h1>
    <p id="msg">We appreciate your response and support.</p>
    <p class="small" id="redir">Redirecting in <span class="k" id="count">6</span> seconds...</p>
    <a id="manual" class="btn" href="#">Continue</a>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const type = (params.get('type') || '').toLowerCase();

    const VOLUNTEER_URL = 'https://civicos-institute.org/volunteer/';
    const EXPERT_URL = 'https://civicos-institute.org/expert-input/';

    const cfg = {
      volunteer: {
        msg: 'Your volunteer interest form is in. We are grateful you want to help build CivicOS.',
        url: VOLUNTEER_URL
      },
      expert: {
        msg: 'Your expert survey response is received. Thank you for contributing your expertise.',
        url: EXPERT_URL
      },
      default: {
        msg: 'Your response has been received. Thank you for supporting CivicOS Institute.',
        url: 'https://civicos-institute.org/'
      }
    };

    const selected = cfg[type] || cfg.default;
    document.getElementById('msg').textContent = selected.msg;
    document.getElementById('manual').href = selected.url;

    let t = 6;
    const countEl = document.getElementById('count');
    const timer = setInterval(() => {
      t -= 1;
      countEl.textContent = t;
      if (t <= 0) {
        clearInterval(timer);
        location.href = selected.url;
      }
    }, 1000);
  </script>
</body>
</html>
